name: Build signed APK

# 让「拿到仓库的人」不需要任何签名材料就能产出**用户可覆盖升级**的正式包。
#
# 签名私钥不进仓库、不进日志、不进 artifact：
#   · 四个 Secret 与 `release.yml` **同名**（同一套材料，不要维护两套命名）：
#     `ANDROID_KEYSTORE_BASE64` / `ANDROID_KEYSTORE_STORE_PASSWORD` /
#     `ANDROID_KEYSTORE_KEY_ALIAS` / `ANDROID_KEYSTORE_KEY_PASSWORD`
#   · 触发者**不需要也不应该**知道口令 —— 他能拿到的是「签好名的 APK」
#
# 为什么放在 Environment `apk-signing` 下：Secret 只有该 Environment 批准后才可用，
# 配合 required reviewers，等于「谁批准谁负责」。部署前提见仓库文档化的三道闸：
#   1. branch protection + CODEOWNERS 管住 `.github/workflows/`（否则有写权限的人能改本文件把 Secret 打出来）
#   2. Environment `apk-signing` 配 required reviewers
#   3. 本文件 permissions 只给 contents: read
#
# 判据不是我写的断言，而是仓库既有的两道闸：
#   · `pnpm run check:keystore` —— 证书指纹必须等于 config/appIdentity.json 的 expectedCertSha256
#   · `pnpm run verify:apk`     —— 发布五件套（debuggable / 变体 / 回环标记 / 证书 / 明文 base）

on:
  workflow_dispatch:
    inputs:
      clean:
        description: '先跑 gradle clean（产物缓存异常时勾选）'
        type: boolean
        default: false
      variant:
        description: '构建变体：standard（对外）/ staging（预发布）'
        type: choice
        options: [standard, staging]
        default: standard

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: assembleRelease + 五件套校验
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: apk-signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 缺少 Secret 时早失败：GitHub 不会因为 Secret 为空而报错，
      # 直接走下去会得到「未签名/错签名」的包，那正是最坏的结果。
      - name: 预检签名 Secret
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${KS_B64:-}" ] || { echo "::error::缺少 Secret ANDROID_KEYSTORE_BASE64（keystore 整文件的 base64）"; exit 1; }
          [ -n "${KS_PASS:-}" ] || { echo "::error::缺少 Secret ANDROID_KEYSTORE_STORE_PASSWORD"; exit 1; }
          echo "签名 Secret 已就位（长度 $(printf %s "$KS_B64" | wc -c) / 口令长度 ${#KS_PASS}）"

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub 托管 runner 预装 Android SDK；build-apk.sh 默认找 $HOME/android-sdk，
      # 所以这里把预装路径显式导出，别让它去装第二份。
      #
      # BUILD_TOOLS_VERSION 必须给具体版本号：build-apk.sh 明确拒绝通配（不允许「取最大版本」）。
      # runner 镜像是固定的，取它已装档位里最高的那个就等价于钉版；同时打印出来备查。
      # 想钉死某档就在仓库里创建 build.env（已 gitignore），或在本步写死版本号。
      - name: Android SDK（用 runner 预装的那份）
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "::error::找不到 Android SDK：$SDK"; exit 1; }
          BTC="$(ls -1 "$SDK/build-tools" | sort -V | tail -1)"
          [ -n "$BTC" ] || { echo "::error::$SDK/build-tools 下没有任何 build-tools 档位"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_VERSION=$BTC" >> "$GITHUB_ENV"
          echo "build-tools 档位: $(ls -1 "$SDK/build-tools" | tr '\n' ' ')→ 选用 $BTC"
          "$SDK"/cmdline-tools/latest/bin/sdkmanager --version 2>/dev/null || true

      # 注入签名材料。落盘位置固定在 $RUNNER_TEMP（不落在仓库目录里），
      # 文件权限 600，脚本结束在 always() 步骤里删除。
      - name: 注入签名材料
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KS="$RUNNER_TEMP/publish.keystore"
          printf '%s' "$KS_B64" | base64 -d > "$KS"
          ALIAS="${KS_ALIAS:-androiddebugkey}"
          ALIAS="${ALIAS:-$(keytool -list -keystore "$KS" -storepass "$KS_PASS" 2>/dev/null | sed -n 's/^\([^,]*\),.*/\1/p' | head -1)}"
          [ -n "$ALIAS" ] || { echo "::error::无法确定 keystore 别名，请设置 Secret ANDROID_KEY_ALIAS"; exit 1; }
          mkdir -p android/keystore
          cat > android/keystore/keystore.properties <<EOF
          storeFileRelease=$KS
          storePasswordRelease=$KS_PASS
          keyAliasRelease=$ALIAS
          keyPasswordRelease=${KS_KEYPASS:-$KS_PASS}
          EOF
          chmod 600 android/keystore/keystore.properties
          echo "已写入 keystore（alias=$ALIAS），路径在 \$RUNNER_TEMP，不入 artifact"

      # 指纹闸门：证书与已发布证书不一致就直接中止，绝不产出「用户装不上」的包。
      - name: 签名凭据自检（指纹必须是已发布证书）
        run: pnpm run check:keystore

      - name: 依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（web → cap sync → assembleRelease）
        env:
          # 变体只在这里透传一次，构建逻辑全在 build-apk.sh（standard 分支与加变体前逐字一致）
          BUILD_VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          echo "构建变体: ${BUILD_VARIANT}"
          if [ "${{ inputs.clean }}" = "true" ]; then ./build-apk.sh release --clean; else ./build-apk.sh release; fi

      # 发布五件套：debuggable / 变体 / 回环标记 / 证书指纹 / 明文 base。
      # 期望证书从 config/appIdentity.json 派生，本文件不写第二份指纹。
      #
      # staging（预发布）与 standard 只有两处不同，其余判据一字不变：
      #   · 第 5 项 INSECURE_CONSUME 会因明文 http 后端为 true —— 必须显式 --allow-insecure
      #     （结论行会强制标 INSECURE(staging-only)，仍然「打得出来但发不安静悄悄」）；
      #   · 第 6 项的期望消费地址从 config/endpoints.staging.json 派生（不传 --expect-consume-base
      #     就会拿生产 config/endpoints.json 的值比，必然不符）。
      # --variant 仍按产物的 ACTUAL 标记填：staging 走的是 build:staging（不设 INTERNAL_BUILD），
      # gradle 的 ARTIFACT_VARIANT 落 standard（见 android/app/build.gradle 的 updateVariant）。
      - name: 产物五件套校验
        env:
          BUILD_VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::没找到 $APK"; exit 1; }
          if [ "${BUILD_VARIANT}" = "staging" ]; then
            EXPECT_CONSUME="$(node -p "require('./config/endpoints.staging.json').consume.baseUrl")"
            echo "staging 变体：期望 consume.baseUrl = ${EXPECT_CONSUME}（明文，staging-only）"
            pnpm run verify:apk -- "$APK" --variant standard --allow-insecure \
              --expect-consume-base "$EXPECT_CONSUME"
          else
            pnpm run verify:apk -- "$APK" --variant standard
          fi

      # 独立复算一次证书指纹并**断言**相等（`verify:apk` 已经查过，这里是第二道，故意重复）：
      # 这一步失败只可能意味着一件事 —— 产出的包用户装不上。
      #
      # 注意别用 `keytool -printcert -jarfile`：APK 只有 v2/v3 签名时它读不出证书（恒失败）。
      # 读 APK 签名证书要用 apksigner。
      - name: 断言产物证书 = 已发布证书
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          EXPECT="$(node -p "require('./config/appIdentity.json').expectedCertSha256" | tr 'A-F' 'a-f')"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          [ -x "$APKSIGNER" ] || { echo "::error::找不到 apksigner：$APKSIGNER"; exit 1; }
          GOT="$("$APKSIGNER" verify --print-certs "$APK" \
                 | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          echo "期望指纹: $EXPECT"
          echo "产物指纹: $GOT"
          [ -n "$GOT" ] || { echo "::error::读不出 APK 的签名证书"; exit 1; }
          [ "$GOT" = "$EXPECT" ] || { echo "::error::产物证书与已发布证书不一致 —— 已安装用户无法覆盖升级，禁止发布"; exit 1; }
          echo "证书指纹 OK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk.sha256"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          # 变体进 artifact 名：staging 包是明文联调包（禁止公开分发），绝不能和 standard 包混淆
          name: apk-${{ inputs.variant }}-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/apk.sha256
          if-no-files-found: error
          retention-days: 14

      # 无论成败都清掉签名材料：runner 是一次性的，但不能指望「机器会销毁」来兜底
      # （self-hosted runner 上就不销毁）。
      - name: 清理签名材料
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/publish.keystore" android/keystore/keystore.properties || true
          echo "已清理 keystore 与 keystore.properties"
